<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV - CHHAY POUNLEUPICH</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #0284c7;
      --text: #1e293b;
      --muted: #475569;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #e2e8f0;
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    /* Action Bar for HR / Visitor */
    .action-bar {
      max-width: 210mm;
      margin: 0 auto 1rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
    }

    .action-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-download {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #0369a1;
    }

    /* A4 Paper Layout */
    .cv-page {
      background: #ffffff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 16mm 18mm;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .cv-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .cv-header h1 {
      font-size: 24pt;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .cv-header .role {
      font-size: 11.5pt;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
      font-size: 9.5pt;
      color: var(--muted);
    }

    .contact-row a {
      color: var(--muted);
      text-decoration: none;
    }

    .cv-section {
      margin-bottom: 14px;
    }

    .cv-section h2 {
      font-size: 11.5pt;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      margin-bottom: 8px;
    }

    .summary-text {
      font-size: 10pt;
      color: var(--text);
      text-align: justify;
    }

    .item {
      margin-bottom: 10px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 10.5pt;
      color: var(--primary);
    }

    .item-sub {
      font-size: 9.5pt;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 3px;
    }

    .item p, .item li {
      font-size: 9.8pt;
      color: var(--text);
    }

    .skills-list {
      font-size: 9.8pt;
    }

    .skills-list p {
      margin-bottom: 4px;
    }

    /* Print / PDF Conversion Rules */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      .action-bar {
        display: none !important;
      }
      .cv-page {
        box-shadow: none;
        width: 100%;
        min-height: auto;
        padding: 0;
        margin: 0;
      }
      @page {
        size: A4;
        margin: 14mm 16mm;
      }
    }

    @media (max-width: 820px) {
      .cv-page, .action-bar {
        width: 100%;
      }
      .cv-page {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="action-bar">
    <a href="index.html">&larr; Back to Portfolio</a>
    <button class="btn-download" onclick="window.print()">Download / Save as PDF</button>
  </div>

  <main class="cv-page">
    <header class="cv-header">
      <h1 id="cv-name">CHHAY POUNLEUPICH</h1>
      <div class="role" id="cv-role"></div>
      <div class="contact-row" id="cv-contact"></div>
    </header>

    <section class="cv-section">
      <h2>Professional Summary</h2>
      <p class="summary-text" id="cv-about"></p>
    </section>

    <section class="cv-section">
      <h2>Education</h2>
      <div id="cv-education"></div>
    </section>

    <section class="cv-section">
      <h2>Technical Skills</h2>
      <div class="skills-list" id="cv-skills"></div>
    </section>

    <section class="cv-section">
      <h2>Projects</h2>
      <div id="cv-projects"></div>
    </section>

    <section class="cv-section">
      <h2>Certifications</h2>
      <div id="cv-certificates"></div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("data/portfolio.json");
        const data = await res.json();
        const p = data.profile;

        document.title = `CV - ${p.name}`;
        document.getElementById("cv-name").textContent = p.name;
        document.getElementById("cv-role").textContent = p.role;
        document.getElementById("cv-about").textContent = p.about;

        // Contact Links
        const contacts = [];
        if (p.location) contacts.push(`<span>${p.location}</span>`);
        if (p.phone) contacts.push(`<a href="tel:${p.phone.replace(/\s+/g, '')}">${p.phone}</a>`);
        if (p.email) contacts.push(`<a href="mailto:${p.email}">${p.email}</a>`);
        if (p.telegram) contacts.push(`<a href="${p.telegram}" target="_blank">Telegram</a>`);
        if (p.github) contacts.push(`<a href="${p.github}" target="_blank">GitHub</a>`);
        if (p.linkedin) contacts.push(`<a href="${p.linkedin}" target="_blank">LinkedIn</a>`);
        contacts.push(`<a href="https://pich-chhay.github.io/my-portfolio/" target="_blank">Portfolio</a>`);
        document.getElementById("cv-contact").innerHTML = contacts.join(" &bull; ");

        // Education / Experience
        const eduContainer = document.getElementById("cv-education");
        eduContainer.innerHTML = (data.experience || []).map(item => `
          <div class="item">
            <div class="item-header">
              <span>${item.role}</span>
              <span>${item.period}</span>
            </div>
            <div class="item-sub">${item.organization}</div>
            <p>${item.description}</p>
          </div>
        `).join("");

        // Skills
        const skillsContainer = document.getElementById("cv-skills");
        skillsContainer.innerHTML = (data.skills || []).map(group => `
          <p><strong>${group.category}:</strong> ${group.items.join(", ")}</p>
        `).join("");

        // Projects
        const projContainer = document.getElementById("cv-projects");
        projContainer.innerHTML = (data.projects || []).map(proj => `
          <div class="item">
            <div class="item-header">
              <span>${proj.title}</span>
              <span style="font-weight: 500; font-size: 9.5pt;">${proj.techStack.join(", ")}</span>
            </div>
            <p>${proj.description}</p>
          </div>
        `).join("");

        // Certificates
        const certContainer = document.getElementById("cv-certificates");
        if (data.certificates && data.certificates.length > 0) {
          certContainer.innerHTML = data.certificates.map(cert => `
            <div class="item">
              <div class="item-header">
                <span>${cert.title}</span>
                <span>${cert.date}</span>
              </div>
              <div class="item-sub">${cert.issuer}</div>
            </div>
          `).join("");
        } else {
          certContainer.innerHTML = `<p style="font-size: 9.8pt;">UX/UI Design, IT Support, Avishkaar Trainer</p>`;
        }
      } catch (err) {
        console.error("Error loading CV data:", err);
      }
    });
  </script>
</body>
</html>
