<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV - CHHAY POUNLEUPICH</title>
  <style>
    /* Default = Dark Mode (Matches Portfolio Default) */
    :root {
      --body-bg: #090d16;
      --paper-bg: #1e293b;
      --primary: #f8fafc;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }

    /* Light Mode (Matches Portfolio [data-theme="light"]) */
    [data-theme="light"] {
      --body-bg: #e2e8f0;
      --paper-bg: #ffffff;
      --primary: #0f172a;
      --accent: #0284c7;
      --text: #1e293b;
      --muted: #475569;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--body-bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* Action Bar */
    .action-bar {
      max-width: 210mm;
      margin: 0 auto 1rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      background: #0f172a;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .action-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .btn-theme {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .btn-theme:hover {
      border-color: #38bdf8;
    }

    .btn-download {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #0369a1;
    }

    /* A4 Paper Layout */
    .cv-page {
      background: var(--paper-bg);
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 16mm 18mm;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: background 0.25s ease;
    }

    .cv-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .cv-header h1 {
      font-size: 24pt;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .cv-header .role {
      font-size: 11.5pt;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      font-size: 9pt;
      color: var(--muted);
    }

    .contact-row a {
      color: var(--muted);
      text-decoration: none;
    }

    .cv-section {
      margin-bottom: 14px;
    }

    .cv-section h2 {
      font-size: 11.5pt;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      margin-bottom: 8px;
    }

    .summary-text {
      font-size: 10pt;
      color: var(--text);
      text-align: justify;
    }

    .item {
      margin-bottom: 10px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 10.5pt;
      color: var(--primary);
    }

    .item-sub {
      font-size: 9.5pt;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 3px;
    }

    .item p, .item li {
      font-size: 9.8pt;
      color: var(--text);
    }

    .skills-list {
      font-size: 9.8pt;
    }

    .skills-list p {
      margin-bottom: 4px;
    }

    /* Always White Paper when Printing / Saving as PDF */
    @media print {
      :root, [data-theme="light"] {
        --body-bg: #ffffff !important;
        --paper-bg: #ffffff !important;
        --primary: #0f172a !important;
        --accent: #0284c7 !important;
        --text: #1e293b !important;
        --muted: #475569 !important;
        --border: #cbd5e1 !important;
      }
      body {
        background: #ffffff !important;
        padding: 0;
      }
      .action-bar {
        display: none !important;
      }
      .cv-page {
        box-shadow: none;
        width: 100%;
        min-height: auto;
        padding: 0;
        margin: 0;
      }
      @page {
        size: A4;
        margin: 14mm 16mm;
      }
    }

    @media (max-width: 820px) {
      .cv-page, .action-bar {
        width: 100%;
      }
      .cv-page {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="action-bar">
    <a href="index.html">&larr; Back to Portfolio</a>
    <div class="action-buttons">
      <button class="btn-theme" id="cv-theme-toggle" onclick="toggleTheme()">☀️ Light</button>
      <button class="btn-download" onclick="window.print()">Download / Save as PDF</button>
    </div>
  </div>

  <main class="cv-page">
    <header class="cv-header">
      <h1 id="cv-name">CHHAY POUNLEUPICH</h1>
      <div class="role" id="cv-role"></div>
      <div class="contact-row" id="cv-contact"></div>
    </header>

    <section class="cv-section">
      <h2>Professional Summary</h2>
      <p class="summary-text" id="cv-about"></p>
    </section>

    <section class="cv-section">
      <h2>Education</h2>
      <div id="cv-education"></div>
    </section>

    <section class="cv-section">
      <h2>Work Experience</h2>
      <div id="cv-work"></div>
    </section>

    <section class="cv-section">
      <h2>Technical Skills</h2>
      <div class="skills-list" id="cv-skills"></div>
    </section>

    <section class="cv-section">
      <h2>Projects</h2>
      <div id="cv-projects"></div>
    </section>

    <section class="cv-section">
      <h2>Certifications</h2>
      <div id="cv-certificates"></div>
    </section>
  </main>

  <script>
    function toggleTheme() {
      const htmlEl = document.documentElement;
      const btn = document.getElementById("cv-theme-toggle");
      const isLight = htmlEl.getAttribute("data-theme") === "light";

      if (isLight) {
        htmlEl.removeAttribute("data-theme");
        btn.textContent = "☀️ Light";
        localStorage.setItem("site-theme", "dark");
      } else {
        htmlEl.setAttribute("data-theme", "light");
        btn.textContent = "🌙 Dark";
        localStorage.setItem("site-theme", "light");
      }
    }

    (function initTheme() {
      const savedTheme = localStorage.getItem("site-theme");
      const btn = document.getElementById("cv-theme-toggle");
      if (savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
        if (btn) btn.textContent = "🌙 Dark";
      }
    })();

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("data/portfolio.json");
        const data = await res.json();
        const p = data.profile;

        document.title = `CV - ${p.name}`;
        document.getElementById("cv-name").textContent = p.name;
        document.getElementById("cv-role").textContent = p.role;
        document.getElementById("cv-about").textContent = p.about;

        const contacts = [];
        if (p.location) contacts.push(`<span>${p.location}</span>`);
        if (p.phone) contacts.push(`<a href="tel:${p.phone.replace(/\s+/g, '')}">${p.phone}</a>`);
        if (p.email) contacts.push(`<a href="mailto:${p.email}">${p.email}</a>`);
        if (p.telegram) contacts.push(`<a href="${p.telegram}" target="_blank">t.me/CHHAY_POUNLEUPICH</a>`);
        if (p.github) contacts.push(`<a href="${p.github}" target="_blank">github.com/Pich-Chhay</a>`);
        if (p.linkedin) contacts.push(`<a href="${p.linkedin}" target="_blank">linkedin.com/in/pich-chhay</a>`);
        contacts.push(`<a href="https://pich-chhay.github.io/my-portfolio/" target="_blank">pich-chhay.github.io/my-portfolio</a>`);
        document.getElementById("cv-contact").innerHTML = contacts.join(" &bull; ");

        const renderExpItem = (item) => `
          <div class="item">
            <div class="item-header">
              <span>${item.role}</span>
              <span>${item.period}</span>
            </div>
            <div class="item-sub">
              ${item.organizationUrl ? `<a href="${item.organizationUrl}" target="_blank" style="color: inherit; text-decoration: none;">${item.organization}</a>` : item.organization}
            </div>
            <p>${item.description}</p>
          </div>
        `;

        const workItems = (data.experience || []).filter(i => i.type === "work");
        const eduItems = (data.experience || []).filter(i => i.type !== "work");

        document.getElementById("cv-work").innerHTML = workItems.map(renderExpItem).join("");
        document.getElementById("cv-education").innerHTML = eduItems.map(renderExpItem).join("");

        const skillsContainer = document.getElementById("cv-skills");
        skillsContainer.innerHTML = (data.skills || []).map(group => `
          <p><strong>${group.category}:</strong> ${group.items.join(", ")}</p>
        `).join("");

        const projContainer = document.getElementById("cv-projects");
        projContainer.innerHTML = (data.projects || []).map(proj => `
          <div class="item">
            <div class="item-header">
              <span>${proj.title}</span>
              <span style="font-weight: 500; font-size: 9.5pt;">${proj.techStack.join(", ")}</span>
            </div>
            <p>${proj.description}</p>
          </div>
        `).join("");

        const certContainer = document.getElementById("cv-certificates");
        if (data.certificates && data.certificates.length > 0) {
          certContainer.innerHTML = data.certificates.map(cert => `
            <div class="item">
              <div class="item-header">
                <span>${cert.title}</span>
                <span>${cert.date}</span>
              </div>
              <div class="item-sub">${cert.issuer}</div>
            </div>
          `).join("");
        } else {
          certContainer.innerHTML = `<p style="font-size: 9.8pt;">UX/UI Design, IT Support, Avishkaar Trainer</p>`;
        }
      } catch (err) {
        console.error("Error loading CV data:", err);
      }
    });
  </script>
</body>
</html>
