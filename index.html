<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pich Chhay | Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-content">
      <a href="#" class="logo" id="nav-name">DevPortfolio</a>
      <nav>
        <ul class="nav-links">
          <li><a href="#about">About</a></li>
          <li><a href="#background">Background</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#certificates">Certificates</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="hero" class="hero-section">
      <h1 id="profile-name">Loading...</h1>
      <p class="subtitle" id="profile-role"></p>
      <p class="bio" id="profile-bio"></p>
    </section>

    <section id="about" class="section">
      <h2>About Me</h2>
      <p id="profile-about"></p>
    </section>

    <section id="background" class="section">
      <h2>Background</h2>
      
      <div class="subsection">
        <h3>Experience & Education</h3>
        <div id="experience-list" class="grid"></div>
      </div>

      <div class="subsection">
        <h3>Technical Skills</h3>
        <div id="skills-container" class="skills-wrapper"></div>
      </div>
    </section>

    <section id="projects" class="section">
      <h2>Featured Projects</h2>
      <div id="projects-grid" class="grid"></div>
    </section>

    <section id="certificates" class="section">
      <h2>Certifications</h2>
      <div id="certificates-grid" class="grid"></div>
    </section>
  </main>

  <footer id="contact" class="footer">
    <div class="container">
      <h2>Let's Connect</h2>
      <div class="social-links" id="social-links"></div>
      <p class="copyright">&copy; <span id="year"></span> <span id="footer-name"></span></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
